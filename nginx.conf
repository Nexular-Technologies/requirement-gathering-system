server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths fall through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Acquisition API, same origin as the UI so no CORS in the browser
  location /api/ {
    proxy_pass http://acquisition-api:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;       # audio submissions
    proxy_read_timeout 120s;
  }
}
